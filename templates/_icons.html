{# Inline SVG icons used by the sidebar. Usage: {{ icon("home") }} #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{%- if name == "dashboard" %}<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
{%- elif name == "academy" %}<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>
{%- elif name == "hacklab" %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 10l3 2-3 2M13 15h4"/>
{%- elif name == "challenges" %}<path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.7 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/>
{%- elif name == "achievements" %}<circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 21l5-3 5 3-1.5-7"/>
{%- elif name == "progress" %}<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>
{%- elif name == "settings" %}<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>
{%- elif name == "about" %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>
{%- elif name == "home" %}<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
{%- elif name == "bell" %}<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/>
{%- elif name == "menu" %}<path d="M4 6h16M4 12h16M4 18h16"/>
{%- endif -%}
</svg>
{%- endmacro %}

{# The CyberShield logo mark #}
{% macro logo() -%}
<svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
  <path d="M24 3l17 6v13c0 11-7 19-17 23C14 41 7 33 7 22V9z" fill="rgba(182,255,0,.08)" stroke="#B6FF00" stroke-width="2"/>
  <path d="M24 12l9 3.2V22c0 6-4.2 10.4-9 12.6C19.2 32.400 15 28 15 22v-6.800z" fill="none" stroke="#00E5FF" stroke-width="1.5"/>
  <path d="M19.500 22.500l3.200 3.200 6-6.500" fill="none" stroke="#B6FF00" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{%- endmacro %}
